
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 - Users Directory</title>
  <script src="users.js" defer></script>
</head>
<body>
  <header>
    <h1>Users Directory</h1>
    <p>Load and search users from an online API.</p>
  </header>

  <main>
    <section aria-labelledby="users-heading">
      <h2 id="users-heading">User List</h2>

      <button id="load-users" type="button">Load Users</button>

      <p>
        <label for="filter-input">Filter users by name:</label>
        <input
          id="filter-input"
          type="text"
          placeholder="Type a name..."
        >
      </p>

      <p id="status" role="status" aria-live="polite">
        Click "Load Users" to get started.
      </p>

      <ul id="users-list"></ul>
    </section>
  </main>
</body>
</html>
